[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codex-video-agent"
version = "0.2.0"
description = "Local-first, review-gated video editing workflow using Python, FFmpeg, local Whisper, and Remotion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-jsonschema>=4.26",
  "types-PyYAML>=6.0",
]
whisper = [
  "openai-whisper",
]

[project.scripts]
videoedit = "videoedit.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/videoedit"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["p[0-9]*-test-basetemp*", ".p[0-9]*-test-basetemp*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["videoedit"]

[[tool.mypy.overrides]]
module = ["whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires local media binaries",
]

[tool.coverage.run]
branch = true
source = ["videoedit"]

[tool.coverage.report]
show_missing = true
fail_under = 80
