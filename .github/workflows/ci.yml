name: ci

on:
  push:
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - name: Run portable contract and unit suite
        run: uv run pytest -q -m "not integration"
      - name: Run portable FFmpeg smoke
        run: uv run pytest -q tests/integration/test_ffmpeg_demo.py -k generate_probe_and_mask_recolor
      - run: uv run python scripts/validate_examples.py
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n workers/sam3/*.sh
          bash -n workers/matanyone2/*.sh

  remotion-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Require lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run typecheck
